name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build & Test (Linux - ${{ matrix.compiler }} - FB ${{ matrix.firebird_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
        firebird_version: [5, 6]
    steps:
    - uses: actions/checkout@v4

    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "g++" ]; then
          sudo apt-get update
          sudo apt-get install -y g++-11
          echo "CXX=g++-11" >> $GITHUB_ENV
        elif [ "${{ matrix.compiler }}" = "clang++" ]; then
          sudo apt-get update
          sudo apt-get install -y clang-16
          echo "CXX=clang++-16" >> $GITHUB_ENV
        fi

    - name: Download and Install Firebird
      run: |
        sudo apt-get update
        sudo apt-get install -y libicu-dev libncurses5 libtommath1 || sudo apt-get install -y libicu-dev libncurses6 libtommath1
        if [ "${{ matrix.firebird_version }}" = "5" ]; then
          URL="https://github.com/FirebirdSQL/firebird/releases/download/v5.0.4/Firebird-5.0.4.1812-0-linux-x64.tar.gz"
        else
          URL=$(curl -s https://api.github.com/repos/FirebirdSQL/snapshots/releases/tags/snapshot-master | python3 -c "import sys, json; data = json.load(sys.stdin); print(next(a['browser_download_url'] for a in data['assets'] if 'linux-x64.tar.gz' in a['name'] and 'debugSymbols' not in a['name']))")
        fi
        echo "Downloading Firebird ${{ matrix.firebird_version }} from: $URL"
        wget -q -O firebird.tar.gz "$URL"
        tar -zxf firebird.tar.gz
        DIR_NAME=$(tar -tf firebird.tar.gz | head -n 1 | cut -f1 -d"/")
        cd "$DIR_NAME"
        sudo ./install.sh -silent
        echo "DatabaseAccess = Full" | sudo tee -a /opt/firebird/firebird.conf

    - name: Start Firebird Service
      run: |
        sudo systemctl restart firebird || sudo service firebird restart
        sleep 2

    - name: Configure CMake
      run: |
        export LD_LIBRARY_PATH=/opt/firebird/lib
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        export LD_LIBRARY_PATH=/opt/firebird/lib
        cmake --build build -j$(nproc)

    - name: Run Unit Tests
      run: |
        export LD_LIBRARY_PATH=/opt/firebird/lib
        ctest --test-dir build --output-on-failure

    - name: Run Integration Tests
      run: |
        sudo usermod -aG firebird runner
        sudo mkdir -p /opt/firebird/test_db
        sudo chmod 777 /opt/firebird/test_db
        sudo chmod -R 777 /tmp/firebird || true
        export LD_LIBRARY_PATH=/opt/firebird/lib
        export TMPDIR=/opt/firebird/test_db
        if [ -f /opt/firebird/SYSDBA.password ]; then
          FIREBIRD_PASSWORD=$(sudo cat /opt/firebird/SYSDBA.password | grep "ISC_PASSWORD=" | cut -d'=' -f2)
          export FIREBIRD_PASSWORD
        fi
        sg firebird -c "python3 tests/integration/test_integration.py"

  build-windows:
    name: Build & Test (Windows - MSVC 2022 - FB ${{ matrix.firebird_version }})
    runs-on: windows-2022
    strategy:
      matrix:
        firebird_version: [5, 6]
    steps:
    - uses: actions/checkout@v4

    - name: Download Firebird client zip
      shell: powershell
      run: |
        if ("${{ matrix.firebird_version }}" -eq "5") {
          $url = "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.4/Firebird-5.0.4.1812-0-windows-x64.zip"
        } else {
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/FirebirdSQL/snapshots/releases/tags/snapshot-master"
          $asset = $release.assets | Where-Object { $_.name -like "Firebird-6.0.0.*-windows-x64.zip" -and $_.name -notlike "*withDebugSymbols*" } | Select-Object -First 1
          $url = $asset.browser_download_url
        }
        Write-Host "Downloading Firebird client from $url"
        curl.exe -L -o firebird.zip $url
        Expand-Archive -Path firebird.zip -DestinationPath C:\firebird

    - name: Configure CMake
      shell: powershell
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_SIDECAR=ON `
          -DFIREBIRD_INCLUDE_DIR=C:\firebird\include `
          -DFIREBIRD_CLIENT_LIB=C:\firebird\lib\fbclient_ms.lib `
          -DFIREBIRD_IB_UTIL_LIB=C:\firebird\lib\ib_util_ms.lib

    - name: Build
      run: cmake --build build --config Release

    - name: Build MSI Installer
      shell: powershell
      run: |
        cd installer/windows
        ./build_msi.ps1 -BuildDir "../../build" -Version "1.0.0"

    - name: Run Unit Tests
      run: ctest --test-dir build -C Release --output-on-failure
