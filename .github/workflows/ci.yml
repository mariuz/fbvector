name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build & Test (Linux - ${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
    - uses: actions/checkout@v4

    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "g++" ]; then
          sudo apt-get update
          sudo apt-get install -y g++-11
          echo "CXX=g++-11" >> $GITHUB_ENV
        elif [ "${{ matrix.compiler }}" = "clang++" ]; then
          sudo apt-get update
          sudo apt-get install -y clang-14
          echo "CXX=clang++-14" >> $GITHUB_ENV
        fi

    - name: Download and Install Firebird 6 Snapshot
      run: |
        sudo apt-get update
        sudo apt-get install -y libicu-dev libncurses5 libtommath1 || sudo apt-get install -y libicu-dev libncurses6 libtommath1
        URL=$(curl -s https://api.github.com/repos/FirebirdSQL/snapshots/releases/tags/snapshot-master | python3 -c "import sys, json; data = json.load(sys.stdin); print(next(a['browser_download_url'] for a in data['assets'] if 'linux-x64.tar.gz' in a['name'] and 'debugSymbols' not in a['name']))")
        echo "Downloading Firebird 6 snapshot from: $URL"
        wget -q -O firebird6.tar.gz "$URL"
        tar -zxf firebird6.tar.gz
        DIR_NAME=$(tar -tf firebird6.tar.gz | head -n 1 | cut -f1 -d"/")
        cd "$DIR_NAME"
        sudo ./install.sh -silent

    - name: Start Firebird Service
      run: |
        sudo systemctl start firebird || sudo service firebird start
        sleep 2

    - name: Configure CMake
      run: |
        export LD_LIBRARY_PATH=/opt/firebird/lib
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        export LD_LIBRARY_PATH=/opt/firebird/lib
        cmake --build build -j$(nproc)

    - name: Run Unit Tests
      run: |
        export LD_LIBRARY_PATH=/opt/firebird/lib
        ctest --test-dir build --output-on-failure

    - name: Run Integration Tests
      run: |
        export LD_LIBRARY_PATH=/opt/firebird/lib
        if [ -f /opt/firebird/SYSDBA.password ]; then
          FIREBIRD_PASSWORD=$(sudo cat /opt/firebird/SYSDBA.password | grep "ISC_PASSWORD=" | cut -d'=' -f2)
          export FIREBIRD_PASSWORD
        fi
        python3 tests/integration/test_integration.py

  build-windows:
    name: Build & Test (Windows - MSVC 2022)
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Download Firebird client zip
      shell: powershell
      run: |
        curl.exe -L -o firebird.zip https://github.com/FirebirdSQL/firebird/releases/download/v4.0.4/Firebird-4.0.4.3010-0-windows-x64.zip
        Expand-Archive -Path firebird.zip -DestinationPath C:\firebird

    - name: Configure CMake
      shell: powershell
      run: |
        cmake -S . -B build `
          -G "Visual Studio 17 2022" `
          -DCMAKE_BUILD_TYPE=Release `
          -DFIREBIRD_INCLUDE_DIR=C:\firebird\include `
          -DFIREBIRD_CLIENT_LIB=C:\firebird\lib\fbclient.lib `
          -DFIREBIRD_IB_UTIL_LIB=C:\firebird\lib\ib_util.lib

    - name: Build
      run: cmake --build build --config Release

    - name: Run Unit Tests
      run: ctest --test-dir build -C Release --output-on-failure
